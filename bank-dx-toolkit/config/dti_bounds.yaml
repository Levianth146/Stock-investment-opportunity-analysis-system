# config/dti_bounds.yaml - Giới hạn L, U để chuẩn hóa 11 chỉ số DTI:  z = 100 * min{1; max[0; (x - L)/(U - L)]}
# Bộ cận cố định cho lần tính chính thức; không hiệu chỉnh theo mẫu 5 ngân hàng.
# Các cận external_reference là lựa chọn tham chiếu của nghiên cứu, KHÔNG phải chuẩn ngành bắt buộc.
# direction=lower_better: z = 100 * clip((U-x)/(U-L), 0, 1), vẫn yêu cầu L < U.
# Nguồn, phép tính và hạn chế: specs/001-bank-dx-assessment/dti-bounds-method.md.
locked: true
version: fixed-reference-v1-2026-10-12
locked_on: '2026-10-12'
calibration_method: natural_scales_and_external_bank_references
method_document: specs/001-bank-dx-assessment/dti-bounds-method.md

bounds:
  K-Q1:
    variable: digital_txn_share
    name: Tỷ lệ giao dịch khách hàng qua kênh số
    unit: "%"
    direction: higher_better
    L: 0
    U: 90
    status: sourced
    source_citation:
      - "NHNN, Quyết định 810/QĐ-NHNN (11/05/2021), Kế hoạch chuyển đổi số ngành Ngân hàng đến 2025, định hướng 2030: mục tiêu >= 70% giao dịch khách hàng qua kênh số năm 2025, 80% năm 2030 (theo Tin nhanh chứng khoán, https://www.tinnhanhchungkhoan.vn/ke-hoach-chuyen-doi-so-nganh-ngan-hang-la-hoan-toan-kha-thi-post270252.html)."
      - "Đại diện Vụ Thanh toán NHNN (Lê Anh Dũng), 15/04/2025: nhiều tổ chức tín dụng có hơn 90% giao dịch tài chính qua kênh số (Tạp chí Thị trường Tài chính Tiền tệ, https://thitruongtaichinhtiente.vn/hon-90-giao-dich-tai-chinh-tai-to-chuc-tin-dung-duoc-thuc-hien-qua-cac-kenh-so-67010.html)."
    rationale: "U = 90% là mức NHNN nêu cho nhóm tổ chức tín dụng dẫn đầu; L = 0 (không có giao dịch số). Mục tiêu 70% của QĐ 810 là mốc trung gian, không dùng làm U vì nhiều NH đã vượt. Giữ cố định mọi năm để so sánh được theo thời gian."
    caveat: "Mỗi NH định nghĩa 'giao dịch số' khác nhau (số lượng vs giá trị, bán lẻ vs toàn hàng); ghi định nghĩa gốc vào dti_inputs.note."

  K-Q2:
    variable: digital_customer_share
    name: Tỷ lệ khách hàng số / tổng khách hàng
    unit: "%"
    direction: higher_better
    L: 0
    U: 100
    status: natural
    source_citation: []
    rationale: "Thang tỷ lệ tự nhiên 0-100%. Chưa tìm được chuẩn ngành công bố cho 'khách hàng số / tổng khách hàng' (định nghĩa 'khách hàng số' khác nhau giữa các NH; tcb 2024 không công bố riêng)."
    caveat: "U = 100 là biên tự nhiên; z bằng tỷ lệ phần trăm. Nếu NH không công bố -> để trống (không điền 0)."

  K-Q3:
    variable: app_rating
    name: Điểm đánh giá ứng dụng (gộp App Store + Google Play, trọng số theo lượt đánh giá)
    unit: sao (1-5)
    direction: higher_better
    L: 1
    U: 5
    status: sourced
    source_citation:
      - "Thang điểm 1-5 sao của Apple App Store và Google Play; công thức z = (r - 1)/4 * 100 theo data-model.md."
    rationale: "Giới hạn là biên của thang đánh giá do cửa hàng ứng dụng quy định."
    caveat: "Điểm chỉ có tại ngày thu thập (05_app_ratings.py ghi ngày); không có lịch sử theo năm -> ghi rõ trong phương pháp."

  S-Q1:
    variable: delta_digital_txn_share
    name: Thay đổi tỷ lệ giao dịch số bình quân năm từ đầu kỳ có dữ liệu
    unit: điểm %/năm
    direction: higher_better
    L: 0
    U: 18
    status: derived
    source_citation:
      - "Suy ra từ K-Q1: (U_K-Q1 - L_K-Q1) / 5 năm = 90/5 = 18 điểm %/năm, 5 là số năm lịch thuộc kế hoạch 2021-2025, được nghiên cứu chọn làm thời hạn mục tiêu; không phải khoảng cách giữa hai mốc dữ liệu."
    rationale: "Tốc độ cần có để đi từ 0 lên mức dẫn đầu 90% trong khung 5 năm của kế hoạch NHNN; L = 0 (không cải thiện). Giảm so với năm trước cho z = 0."
    caveat: "Cận do nghiên cứu suy ra, không phải chuẩn ngành công bố. Code đo tốc độ bình quân từ mốc đầu có dữ liệu, không nhất thiết chỉ so với năm trước. NH đã gần trần (>85%) khó có Δ lớn: cân nhắc ghi nhận hạn chế này."

  S-Q2:
    variable: digital_customers_cagr
    name: Tăng trưởng kép số khách hàng số (CAGR)
    unit: "%/năm"
    direction: higher_better
    L: 0
    U: 24.455463
    status: external_reference
    source_citation:
      - "Santander Annual Report 2018, trang in 6, bảng kế hoạch 2015-2018: https://www.santander.de/content/pdf/investor-relations/geschaeftsberichte/geschaeftsbericht-santander-2018-englisch.pdf"
      - "Bản nộp SEC cùng báo cáo: https://www.sec.gov/Archives/edgar/data/891478/000155837019002417/san-20181231x20f.htm"
    rationale: "U = 100*((32.0/16.6)^(1/3)-1), CAGR khách hàng số của ngân hàng ngoài mẫu; L = 0, không tăng trưởng. Cận tham chiếu, không phải mức tối ưu ngành."
    caveat: "Hai mốc phải cùng định nghĩa khách hàng số; không thay bằng số giao dịch. Cần ít nhất 2 năm theo code. Vượt U được kẹp 100."

  T-Q1:
    variable: software_cost_to_assets
    name: Nguyên giá phần mềm máy tính cuối kỳ / tổng tài sản bình quân
    unit: "%"
    direction: higher_better
    L: 0
    U: 0.303798
    status: external_reference
    source_citation:
      - "DBS Annual Report 2019, trang in 148-149 (PDF trang 77), note 26.1; trang in 189 (PDF trang 97): https://www.dbs.com/iwov-resources/images/investors/annual-report/dbs-annual-report-2019.pdf"
    rationale: "U = 100*1716/((550751+578946)/2), cùng đơn vị triệu SGD. Dùng nguyên giá, không dùng giá trị còn lại hoặc chi phí CNTT. L = 0."
    caveat: "Khác biệt vốn hóa phần mềm và thuê dịch vụ có thể làm lệch so sánh. Chi nhiều chưa chứng minh hiệu quả; higher_better là giả định của mô hình. Vượt U được kẹp 100."

  T-Q2:
    variable: platform_coverage
    name: Tỷ lệ phủ 8 nền tảng số (checklist manual_audit.xlsx)
    unit: "%"
    direction: higher_better
    L: 0
    U: 100
    status: natural
    source_citation:
      - "Checklist 8 nền tảng do đề tài định nghĩa (scripts/00_make_templates.py, PLAT)."
    rationale: "Chỉ số tự định nghĩa: số nền tảng đạt / 8; biên tự nhiên 0-100%."
    caveat: "Chỉ có tại thời điểm kiểm kê (ngày ghi trong manual_audit.xlsx), không có lịch sử theo năm."

  O-Q1:
    variable: delta_cir
    name: Thay đổi CIR bình quân năm từ đầu kỳ có dữ liệu
    unit: điểm %/năm
    direction: lower_better
    L: -0.584529
    U: 0
    status: external_reference
    source_citation:
      - "DBS Annual Report 2019, trang in 189 (PDF trang 97), bảng 5 năm: https://www.dbs.com/iwov-resources/images/investors/annual-report/dbs-annual-report-2019.pdf"
    rationale: "L = 100*(((14544-8286)/14544)-((10801-5901)/10801))/4, thay đổi CIR toàn tập đoàn 2015-2019. U = 0, không cải thiện; giảm ít nhất bằng mốc L đạt 100. Không lấy chênh CIR giữa các nhóm ngân hàng làm tốc độ năm."
    caveat: "CIR chịu ảnh hưởng thu nhập, lãi suất, cơ cấu kinh doanh và hạch toán. Mốc giảm khá nhỏ, dễ đạt trần; không chứng minh tác động nhân quả của chuyển đổi số."

  O-Q2:
    variable: income_per_employee_cagr
    name: Tăng trưởng kép thu nhập hoạt động trên CBNV bình quân (CAGR)
    unit: "%/năm"
    direction: higher_better
    L: 0
    U: 1.18425
    status: external_reference
    source_citation:
      - "DBS Annual Report 2019, trang in 68-69 (PDF trang 37) và 189 (PDF trang 97): https://www.dbs.com/iwov-resources/images/investors/annual-report/dbs-annual-report-2019.pdf"
      - "DBS Annual Report 2015, trang in 200 (PDF trang 196), bảng nhân sự: https://www.dbs.com/annualreports/2015/pdfs/downloads/full-annual-report-2015.pdf"
    rationale: "U = 100*(((14544/((26857+28526)/2))/(10801/((21096+22017)/2)))^(1/4)-1). Thu nhập hoạt động / nhân sự bình quân đầu-cuối năm, cùng công thức code; L = 0."
    caveat: "Tăng nhân sự, mua bán/sáp nhập, thuê ngoài, lạm phát và tỷ giá ảnh hưởng kết quả. Cận tham chiếu khá thấp, có thể kẹp nhiều quan sát ở 100; không dùng tăng năng suất theo giờ thay cho chỉ số này."

  C-Q1:
    variable: tech_staff_share
    name: Tỷ lệ nhân sự công nghệ / tổng CBNV
    unit: "%"
    direction: higher_better
    L: 0
    U: 100
    status: natural
    source_citation:
      - "Biên toán học của tỷ lệ tập con: 0 <= nhân sự công nghệ <= tổng nhân sự, cùng phạm vi và thời điểm."
    rationale: "Chưa có nguồn đủ chắc để xác lập tỷ lệ nhân sự công nghệ tối ưu. Dùng biên tự nhiên: z bằng tỷ lệ phần trăm, không gán 20% hay 30% thành chuẩn ngành."
    caveat: "U = 100 là biên toán học, không phải mục tiêu tổ chức ngân hàng. Chỉ số có điểm thấp và đóng góp thực tế nhỏ; phải công bố hạn chế này. Loại nhà thầu khỏi tử số nếu mẫu số không gồm nhà thầu; thiếu dữ liệu để trống."

  C-Q2:
    variable: training_hours_per_head
    name: Số giờ đào tạo bình quân / CBNV
    unit: giờ/người/năm
    direction: higher_better
    L: 0
    U: 38.7
    status: external_reference
    source_citation:
      - "DBS Annual Report 2019, trang in 68-69 (PDF trang 37), chỉ tiêu đào tạo: https://www.dbs.com/iwov-resources/images/investors/annual-report/dbs-annual-report-2019.pdf"
    rationale: "U lấy giờ đào tạo bình quân công bố của DBS năm 2019; L = 0. Tham chiếu ngân hàng ngoài mẫu trước giai đoạn nghiên cứu, không phải quy định đào tạo tối thiểu."
    caveat: "Phải ghi phạm vi nhân sự và hình thức đào tạo; DBS dùng nhân viên chính thức trong thống kê đào tạo. Nhiều giờ chưa chứng minh chất lượng; vượt U kẹp 100."

# Khóa cận không có nghĩa đã đủ dữ liệu hoặc mô hình đã được kiểm chứng.
# Giữ thiếu dữ liệu là trống; không hiệu chỉnh cận theo thứ hạng/kết quả của 5 ngân hàng.
# Bản nháp trước khóa: out/dti_bounds_review_2026-10-12/dti_bounds.before.yaml.
