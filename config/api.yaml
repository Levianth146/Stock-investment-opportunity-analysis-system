# Feature 011 — FastAPI layer (web demo). Chỉ đọc kết quả pipeline; LLM theo yêu cầu.
snapshots_dir: data/snapshots_ext
asof: 2026-10-14  # auto = ngày mới nhất có snapshot; hoặc YYYY-MM-DD
default_profile: long_term
host: 127.0.0.1
port: 8000
cors_origins: []              # ví dụ: ["http://localhost:5173"]
docs_enabled: false           # tắt /docs, /redoc, /openapi.json khi public
trust_proxy_headers: true     # tunnel Cloudflare: lấy IP thật từ CF-Connecting-IP (nếu chạy KHÔNG qua tunnel thì đặt false)
proxy_ip_header: CF-Connecting-IP
debate_live_max_per_hour: 10
debate_live_max_per_ip_per_hour: 3
debate_live_max_per_day: 15   # trần UTC/ngày, lưu data/api_cache/_debate_budget.json
debate_job_max_workers: 2     # pool nền POST /debate/jobs (feature 014j)
cache_dir: data/api_cache
web_dist_dir: web/dist        # nếu tồn tại index.html → phục vụ SPA tại / (feature 014)

# Feature 017a — realtime (display + phân tích tạm tính; không vào M2–M7)
realtime:
  enabled: true                 # false → luôn SnapshotQuoteProvider, state=no_realtime
  max_symbols: 250              # trần subscribe (liquid + đang xem)
  max_per_connection: 200       # giới hạn SDK DNSE
  price_scale: 1000             # số cố định hoặc "auto" (bình chọn ≥20 mã, đa số ≥90% rồi khoá)
  stale_after_sec: 90
  sse_heartbeat_sec: 15
  sse_max_symbols: 20
  sse_max_per_ip: 5
  market_sse_max_per_ip: 2        # /api/stream/market (trang chủ) — 1 tab = 1 kết nối
  market_stream_interval_sec: 1.5
  market_stream_idle_sec: 15       # ngoài giờ: kiểm tra thưa, chỉ heartbeat nếu không đổi
  market_stream_lists_sec: 4
