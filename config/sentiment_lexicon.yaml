  bị xử phạt: -1.2
  bị phạt: -1.1
  vi phạm: -1.1
  giải thể: -0.9
  hủy hợp đồng: -1.0
  chậm nộp: -0.7
  đính chính báo cáo: -0.5
  không còn là cổ đông lớn: -0.4

# Dòng vốn / tự doanh — nhân thêm flow_weight_multiplier trong code.
flow_positive:
  khối ngoại mua ròng: 0.8
  tự doanh mua ròng: 0.7
  mua ròng: 0.6

flow_negative:
  khối ngoại bán ròng: -0.8
  tự doanh bán ròng: -0.7
  bán ròng: -0.6

# Ép trung tính khi khớp (không hard-code trong _classify_title).
force_neutral:
  - phát hành cổ phiếu thưởng
  - phát hành cổ phiếu để trả cổ tức
  - phát hành cổ phiếu trả cổ tức
  - phát hành cp để trả cổ tức
  - phát hành cp trả cổ tức
  - cổ phiếu để trả cổ tức
  - cổ phiếu trả cổ tức
  - cổ tức bằng cổ phiếu
  - cổ tức bằng cp
  - phcp để trả cổ tức
  - đính chính
  - quản trị rủi ro
  - giải trình

# Phủ định trong cửa sổ token trước cụm hướng (config negation_window_tokens).
negation_phrases:
  - chấm dứt
  - thoát khỏi
  - không còn
  - thoát
  - hết
  - chưa
  - không
  - tránh

# Dấu hiệu tiêu đề tóm tắt thị trường → weight 0 trừ khi mã dẫn "X:".
market_summary_markers:
  - vn-index
  - vnindex
  - phiên ngày
  - thị trường chứng khoán ngày

# Cụm hành động giá gắn mã trong market summary → weight 0.6 (không 0).
# Khớp trong cửa sổ token quanh mã (market_summary_ticker_action_window).
market_summary_ticker_action_phrases:
  - ngược dòng
  - tăng trần
  - giảm sàn
  - dư bán sàn
  - kịch biên độ
  - kịch trần
  - tăng mạnh
  - giảm mạnh
  - hụt hơi
  - lao dốc
  - hit the ceiling
  - surged
  - plunged

# Issuer báo cáo / CTCK — không phải chủ thể → weight 0.
research_issuer_markers:
  - research
  - securities
  - chứng khoán
  - dự báo của
