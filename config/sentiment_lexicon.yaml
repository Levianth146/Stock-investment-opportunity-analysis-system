# Đối tượng đảo chiều: cụm tiêu cực (vd giảm mạnh) gần flip_object trong ±3 token → dương.
# Ví dụ: "nợ vay giảm mạnh" → tích cực.
flip_objects:
  - nợ vay
  - nợ
  - chi phí
  - lỗ
  - nợ xấu
  # Không gồm "áp lực" — tránh đảo "giảm sàn giữa áp lực giải chấp".

# Công bố / filing — nguồn vnstock/VCI chỉ lấy hướng từ nhóm này.
announcements_positive:
  tăng vốn thành công: 0.8
  trả cổ tức: 0.6
  tạm ứng cổ tức: 0.6
  chia cổ tức: 0.6
