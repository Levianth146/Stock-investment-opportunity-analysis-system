# Phép kiểm minh họa (feature 014g) — không thay công thức điểm M7.
# basis: published | sector_percentile | convention | illustrative | info
# side: reward | risk | info
# applies_to: non_bank | bank | all

version: 1
min_sector_peers: 8
hide_f_score_if_y_lt: 5

basis_tooltip:
  published: "Theo Piotroski (2000)"
  graham: "Theo Graham"
  sector_percentile: "Phân vị trong ngành"
  convention: "Quy ước phổ biến"
  illustrative: "Minh họa"
  info: "Thông tin"

method_disclaimer: "Ngưỡng chưa được kiểm định trên thị trường Việt Nam."

